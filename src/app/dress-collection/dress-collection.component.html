
<section class="min-h-screen bg-black text-white py-16 px-6">

  <div class="flex flex-col items-center">

    <h1 class="text-5xl font-bold text-center mb-6">
      Dress Collection
    </h1>

    <button
      routerLink=""
      class="font-bold bg-black text-white px-6 py-3 rounded-full">
      Home
    </button>

  </div>

  <!-- Loading indicator -->
  <div
    *ngIf="isLoading"
    class="flex flex-col items-center justify-center py-20"
    role="status"
    aria-live="polite">

    <div
      class="w-14 h-14 border-4 border-white/20
             border-t-white rounded-full animate-spin">
    </div>

    <p class="mt-4 text-white text-lg">
      Loading collections...
    </p>

  </div>

  <!-- Error message -->
  <div
    *ngIf="!isLoading && errorMessage"
    class="text-center py-10">

    <p class="text-red-400">
      {{ errorMessage }}
    </p>

    <button
      (click)="loadCollections()"
      class="mt-4 font-bold underline">
      Try Again
    </button>

  </div>

  <!-- Collections grid -->
  <div
    *ngIf="!isLoading && !errorMessage"
    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

    <div
      *ngFor="let collection of collections"
      class="group cursor-pointer"
      (click)="openGallery(collection.images)">

      <div class="overflow-hidden rounded-3xl relative">

        <img
          [src]="collection.cover"
          [alt]="collection.title"
          class="w-full h-[500px] object-cover
                 group-hover:scale-110 transition duration-500">

        <div
          class="absolute inset-0 bg-black/30
                 group-hover:bg-black/10 transition">
        </div>

      </div>

      <h2 class="text-2xl font-semibold mt-4 text-center">
        {{ collection.title }}
        {{ collection.priceRange }}
      </h2>

    </div>

  </div>

  <!-- Empty state -->
  <div
    *ngIf="!isLoading && !errorMessage && collections.length === 0"
    class="text-center py-10 text-white/60">

    No collections available.

  </div>

  <!-- Image gallery -->
  <div
    *ngIf="isViewerOpen"
    class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center">

    <button
      (click)="closeGallery()"
      class="absolute top-6 right-6 text-white text-5xl z-50">
      ×
    </button>

    <button
      (click)="prevImage()"
      class="absolute left-6 text-white text-6xl z-50">
      ❮
    </button>

    <img
      [src]="selectedImages[currentIndex]"
      class="max-h-[90vh] max-w-[90vw] object-contain rounded-2xl shadow-2xl">

    <button
      (click)="nextImage()"
      class="absolute right-6 text-white text-6xl z-50">
      ❯
    </button>

  </div>

</section>
