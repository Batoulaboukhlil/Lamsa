<section id="tracking" class="py-16 bg-gray-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <div class="grid md:grid-cols-2 gap-12 items-center">

      <div>

        <h2 class="text-3xl font-bold text-gray-900 mb-4">
          {{ service.name }}
        </h2>

        <p class="text-gray-700 mb-6">
          {{ service.priceRange }}
        </p>

        <div class="bg-white rounded-xl p-10 shadow-sm">

          <h3 class="font-medium mb-4">
            {{ service.subDescription }}
          </h3>

          <div class="flex">

            <div class="flex flex-col items-center mr-4">
              <div class="rounded-full bg-primary w-8 h-8 flex items-center justify-center">
                <i class="fas fa-plane-departure text-white text-sm"></i>
              </div>

              <div class="w-0.5 h-16 bg-gray-200 my-1"></div>
            </div>

            <div class="pb-6">

              <p class="font-medium">
                Description
              </p>

              <p class="text-sm mt-1">
                {{ service.description }}
              </p>

              <br>

              <!-- Options -->
              <div class="grid text-xs text-gray-500"
                   [ngClass]="'grid-cols-' + service.options.length">

                <div *ngFor="let option of service.options; let i = index"
                     class="text-center">

                  <div>{{ option }}</div>

                </div>

              </div>

            </div>

          </div>

        </div>

      </div>

      <!-- Right Side Images -->
      <div class="grid gap-4 mt-28"
           [ngClass]="{
          'grid-cols-1': (img?.length || 1) === 1,
          'grid-cols-2': (img?.length || 0) === 2,
          'grid-cols-3': (img?.length || 0) >= 3
           }">

        <!-- If images exist -->
        <ng-container *ngIf="img && img.length > 0; else fallbackImage">

          <div *ngFor="let image of img">

            <img
              [src]="image.imageUrl"
              alt="Service Image"
              class="w-full h-64 object-cover rounded-xl shadow-sm hover:scale-105 transition duration-300">

          </div>

        </ng-container>

        <!-- Fallback Logo -->
        <ng-template #fallbackImage>

          <img
            [src]="service?.logo"
            alt="Service Logo"
            class="w-full h-64 object-cover rounded-xl shadow-sm">

        </ng-template>

      </div>

    </div>

  </div>
</section>
