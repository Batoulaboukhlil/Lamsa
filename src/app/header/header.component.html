<header class="hero relative overflow-hidden">

  <!-- Background Video -->
  <video autoplay muted loop
         class="absolute top-0 left-0 w-full h-full object-cover -z-10">
    <source src="hero.mp4" type="video/mp4">
  </video>

  <!-- Dark Overlay -->
  <div class="absolute inset-0 bg-black/50 -z-10"></div>

  <nav
    [class.scrolled]="scrolled"
    class="glass-morphism w-full relative z-50 transition-all duration-500 py-4"
    id="navbar">

    <div class="max-w-7xl mx-auto px-6">

      <div class="flex justify-between items-center">

        <!-- Logo -->
        <div class="flex items-center space-x-4">
          <div
            class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent hover:scale-110 transition-transform duration-300">
            <a href="#home" class="flex items-center">
              <span class="animate-bounce mr-2">🚀</span>
              <span class="typing-animation">Lamsa</span>
            </a>
          </div>
        </div>

        <!-- Desktop Menu -->
        <div class="hidden lg:flex items-center space-x-8">
          <a href="#home" class="text-white hover:text-purple-400">Home</a>
          <a routerLink="/services" class="text-white hover:text-purple-400">Services</a>
          <a routerLink="/bride-collection" class="text-white hover:text-purple-400">Bride Collection</a>
          <a routerLink="/about" class="text-white hover:text-purple-400">About Us</a>
          <a routerLink="/contact" class="text-white hover:text-purple-400">Contact</a>
        </div>

        <!-- Mobile Hamburger -->
        <button
          class="lg:hidden text-white text-3xl"
          (click)="menuOpen = !menuOpen">
          ☰
        </button>

      </div>

      <!-- Mobile Menu -->
      <div
        *ngIf="menuOpen"
        class="lg:hidden mt-4 bg-black/80 rounded-lg p-4">

        <div class="flex flex-col space-y-4">

          <a
            href="#home"
            class="text-white"
            (click)="menuOpen = false">
            Home
          </a>

          <a
            routerLink="/services"
            class="text-white"
            (click)="menuOpen = false">
            Services
          </a>

          <a
            routerLink="/bride-collection"
            class="text-white"
            (click)="menuOpen = false">
            Bride Collection
          </a>

          <a
            routerLink="/about"
            class="text-white"
            (click)="menuOpen = false">
            About Us
          </a>

          <a
            routerLink="/contact"
            class="text-white"
            (click)="menuOpen = false">
            Contact
          </a>

        </div>

      </div>

    </div>

  </nav>

</header>
